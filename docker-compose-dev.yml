x-qdrant-config: &qdrant-config
  # Qdrant connection settings for debugging
  QDRANT_HOST: qdrant
  QDRANT_PORT: 6333
  QDRANT_GRPC_PORT: 6334
  QDRANT_API_KEY: ""  # No API key needed for local development

x-postgres-config: &postgres-config
  # Postgres environment variables for the postgres service itself
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: mcpdb

x-db-config: &db-config
  # Database connection settings for services that connect to postgres
  # Using localhost since services use network_mode: host (Linux only)
  # For Docker Desktop (Mac/Windows): Remove network_mode and use host.docker.internal
  DB_HOST: localhost
  DB_PORT: 5432
  DB_USER: postgres
  DB_PASSWORD: postgres

