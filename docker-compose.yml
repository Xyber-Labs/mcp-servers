  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_storage
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC
    environment:
      <<: *qdrant-config
    restart: unless-stopped

volumes:
  qdrant-data:
