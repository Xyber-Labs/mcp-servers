x-qdrant-config: &qdrant-config
  # Qdrant connection settings for debugging
  QDRANT_HOST: http://qdrant
  QDRANT_PORT: 6333
  QDRANT_GRPC_PORT: 6334
  QDRANT_API_KEY: ""  # No API key needed for local development

x-postgres-config: &postgres-config
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: mcpdb

services:

  mcp_server_aave:
    build:
      context: ./mcp-server-aave
      dockerfile: Dockerfile
    image: mcp_server_aave
    container_name: mcp_server_aave
    command: ["python", "-m", "mcp_server_aave", "--port", "8100"]
    ports:
      - "8100:8100"
    env_file:
      - ./mcp-server-aave/.env
    restart: unless-stopped

  mcp_server_arxiv:
    build:
      context: ./mcp-server-arxiv
      dockerfile: Dockerfile
    image: mcp_server_arxiv
    container_name: mcp_server_arxiv
    command: ["python", "-m", "mcp_server_arxiv", "--port", "8101"]
    ports:
      - "8101:8101"
    env_file:
      - ./mcp-server-arxiv/.env
    restart: unless-stopped

  mcp_server_cartesia:
    build:
      context: ./mcp-server-cartesia
      dockerfile: Dockerfile
    image: mcp_server_cartesia
